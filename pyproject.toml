[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neuraltrust-haystack"
dynamic = ["version"]
description = "NeuralTrust TrustGuard security components for Haystack pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NeuralTrust" }]
keywords = ["haystack", "neuraltrust", "trustguard", "guardrails", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = ["haystack-ai>=2.31.0,<4", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://neuraltrust.ai"
Documentation = "https://docs.neuraltrust.ai/integrations/haystack"
Repository = "https://github.com/NeuralTrust/neuraltrust-haystack"
Issues = "https://github.com/NeuralTrust/neuraltrust-haystack/issues"

[dependency-groups]
dev = [
  "build>=1.2", "hatch>=1.14", "mypy>=1.15", "pytest>=8,<10", "pytest-asyncio>=0.25",
  "pytest-cov>=6", "respx>=0.22", "ruff>=0.11", "twine>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.hatch.version]
path = "src/haystack_integrations/components/guardrails/neuraltrust/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/README.md", "/LICENSE", "/pyproject.toml", "/CHANGELOG.md"]

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = ["ruff check .", "ruff format --check ."]
typing = "mypy src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
asyncio_mode = "auto"
markers = ["live: opt-in calls to production TrustGuard using explicit credentials"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["haystack_integrations.components.guardrails.neuraltrust"]

[tool.coverage.report]
show_missing = true
