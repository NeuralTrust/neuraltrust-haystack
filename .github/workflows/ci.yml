# Shared Python CI follows langchain-neuraltrust; reusable jobs are pinned.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python
    permissions:
      contents: read
      id-token: write # Required by the reusable Python job.
    uses: NeuralTrust/workflows/.github/workflows/tests.yml@ab9c0eda7ab13a6a7df5d04ecc048651c46c18cf
    with:
      language: python
      language_version: "3.12"
      uv_sync_args: --locked --all-groups
      lint_command: |
        uv run --no-sync ruff check .
        uv run --no-sync ruff format --check .
        uv run --no-sync mypy src
      # One shared call runs lint once and reports all ten test combinations.
      # Disabling a shared sibling job creates a skipped check for every call.
      test_command: |
        export HAYSTACK_TELEMETRY_ENABLED=false
        export HAYSTACK_CONTENT_TRACING_ENABLED=false
        {
          echo "## Python / Haystack compatibility"
          echo ""
          echo "| Python | Haystack | Result |"
          echo "| --- | --- | --- |"
        } >> "$GITHUB_STEP_SUMMARY"
        failed=0
        for python_version in 3.10 3.11 3.12 3.13 3.14; do
          for haystack_version in 2.31.0 3.1.1; do
            echo "::group::Python $python_version / Haystack $haystack_version"
            export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/haystack-$python_version-$haystack_version"
            if uv sync --python "$python_version" --locked --all-groups &&
               uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" "haystack-ai==$haystack_version" &&
               uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python" &&
               "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -m "not live"; then
              result=PASS
            else
              result=FAIL
              failed=1
              echo "::error::Python $python_version / Haystack $haystack_version failed"
            fi
            echo "| $python_version | $haystack_version | $result |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
        done
        exit "$failed"

  security:
    permissions:
      contents: read
      pull-requests: write # Shared Trivy findings comment, as in the other integrations.
    uses: NeuralTrust/workflows/.github/workflows/sast.yml@ab9c0eda7ab13a6a7df5d04ecc048651c46c18cf
    with:
      bandit_enabled: true
      bandit_path: src
      pip_audit_enabled: true

  package:
    name: Package build and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - run: python scripts/release_version.py check --dist dist
