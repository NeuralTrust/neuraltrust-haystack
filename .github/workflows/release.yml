name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to verify (leave empty to verify the selected ref)
        type: string
        default: ""
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test and build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAYSTACK_TELEMETRY_ENABLED: "false"
      HAYSTACK_CONTENT_TRACING_ENABLED: "false"
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
      - run: uv sync --locked --all-groups
      - run: python scripts/release_version.py check --tag "$RELEASE_TAG"
      - run: uv run --no-sync pytest -m "not live"
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - run: python scripts/release_version.py check --tag "$RELEASE_TAG" --dist dist
      - name: Save verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Verification summary
        run: |
          {
            echo "## Release verification passed"
            echo "Tests, wheel/sdist metadata, and embedded versions passed."
            if [ -n "$RELEASE_TAG" ]; then
              echo "Verified release tag: $RELEASE_TAG"
            else
              echo "Verified the selected ref without requiring a release tag."
            fi
            echo "PyPI upload runs separately for every published GitHub release; manual verification does not publish."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified artifacts to PyPI
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/neuraltrust-haystack
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
      - run: uv publish --trusted-publishing always
