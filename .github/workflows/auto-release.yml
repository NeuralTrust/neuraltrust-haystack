name: Auto Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and validate the next version without creating a release
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "README.md"
      - "CONTRIBUTING.md"

concurrency:
  # The shared workflow uses auto-release-${{ github.ref }} itself.
  group: auto-release-caller-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      ((github.event_name == 'workflow_dispatch' && inputs.dry_run) || vars.RELEASE_ENABLED == 'true')
    uses: NeuralTrust/workflows/.github/workflows/ai-release-bump.yml@ab9c0eda7ab13a6a7df5d04ecc048651c46c18cf
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      initial_version: v0.1.0
      update_changelog: true
      # Hatch reads the same file at build time. Dynamic versions have no
      # duplicated package-version entry in pyproject.toml or uv.lock.
      version_update_script: python3 scripts/release_version.py set "$VERSION"
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  verify_version_update:
    name: Validate computed version without committing
    needs: release
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate the shared workflow output and version update hook
        run: |
          test -n "$RELEASE_TAG"
          python scripts/release_version.py set "${RELEASE_TAG#v}"
          python scripts/release_version.py check --tag "$RELEASE_TAG"
          {
            echo "## Auto-release preflight passed"
            echo "Computed tag: $RELEASE_TAG"
            echo "The version update hook passed in the temporary checkout."
            echo "No commit, tag, release, or package was published."
          } >> "$GITHUB_STEP_SUMMARY"
