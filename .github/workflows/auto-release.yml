name: Auto Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and validate the next version without creating a release
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "README.md"
      - "CONTRIBUTING.md"

concurrency:
  # The shared workflow uses auto-release-${{ github.ref }} itself.
  group: auto-release-caller-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release_policy:
    name: Determine whether to start a release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.policy.outputs.should_run }}
    steps:
      - name: Allow explicit release requests or an established release history
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DRY_RUN" != "true" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::Create releases only from the repository default branch."
              exit 1
            fi
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Explicit manual release request; no existing release is required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT_NAME" != "push" ]; then
            echo "::error::Unsupported auto-release event."
            exit 1
          fi
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Automatic releases run only from the default branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A failed API request must fail this job, never look like empty history.
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/release-history.json"
          HAS_RELEASE=$(jq -r 'any(.[][];
            .draft == false and .prerelease == false and .published_at != null and
            (.tag_name | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
          )' "$RUNNER_TEMP/release-history.json")
          echo "should_run=$HAS_RELEASE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_RELEASE" = "true" ]; then
            echo "A published stable release exists; automatic release processing can start." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Automatic releases start after the first published stable GitHub release."
              echo "Publish the initial release manually, or dispatch Auto Release with dry_run=false on the default branch."
              echo "No release will be created by this push."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release_permissions:
    name: Verify release token against effective branch rules
    needs: release_policy
    if: needs.release_policy.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the release PAT without attempting a write
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/check_release_permissions.py "$GITHUB_REPOSITORY" "$RELEASE_BRANCH"

  release:
    needs: release_permissions
    if: >-
      github.ref_name == github.event.repository.default_branch ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    uses: NeuralTrust/workflows/.github/workflows/ai-release-bump.yml@ab9c0eda7ab13a6a7df5d04ecc048651c46c18cf
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      initial_version: v0.1.0
      update_changelog: true
      # Hatch reads the same file at build time. Dynamic versions have no
      # duplicated package-version entry in pyproject.toml or uv.lock.
      version_update_script: python3 scripts/release_version.py set "$VERSION"
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  verify_version_update:
    name: Validate computed version without committing
    needs: release
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate the shared workflow output and version update hook
        run: |
          test -n "$RELEASE_TAG"
          python scripts/release_version.py set "${RELEASE_TAG#v}"
          python scripts/release_version.py check --tag "$RELEASE_TAG"
          {
            echo "## Auto-release preflight passed"
            echo "Computed tag: $RELEASE_TAG"
            echo "The version update hook passed in the temporary checkout."
            echo "No commit, tag, release, or package was published."
          } >> "$GITHUB_STEP_SUMMARY"
