name: PR metadata

on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    uses: NeuralTrust/workflows/.github/workflows/pr-metadata.yml@ab9c0eda7ab13a6a7df5d04ecc048651c46c18cf
